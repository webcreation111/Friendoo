<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friends — Friendo</title>
<link rel="stylesheet" href="main.css">
</head>
<body data-page="friends">
<div class="app has-desktop-nav">

  <div class="topnav">
    <a href="people.html" class="brand"><img src="logo.png" alt="Friendo"><span>Friendo</span></a>
    <div class="topnav-links">
      <a href="index.html" data-nav="home">Home</a>
      <a href="people.html" data-nav="people">People</a>
      <a href="friends.html" data-nav="friends">Friends</a>
      <a href="chatting.html" data-nav="chatting">Chatting</a>
      <a href="profile.html" data-nav="profile">Profile</a>
      <a href="settings.html" data-nav="settings">Settings</a>
    </div>
    <div class="topnav-right">
  
      <a class="btn btn-primary btn-sm" href="payment.html">Buy</a>
    </div>
  </div>

  <div class="mobile-topbar">
    
    <a href="payment.html" style="font-size:13px;color:var(--primary-dark);font-weight:600;">Buy</a>
  </div>

  <div class="page-content">
    <h1 class="page-title">Friends</h1>
    <div class="tabs">
      <div class="tab active" id="tab-friends" onclick="showTab('friends')">Friends</div>
      <div class="tab" id="tab-sent" onclick="showTab('sent')">Sent</div>
      <div class="tab" id="tab-received" onclick="showTab('received')">Received</div>
    </div>
    <div id="friendsContent"></div>
  </div>

  <div class="bottomnav">
    <a href="people.html" data-nav="people"><span class="icon">&#128101;</span>People</a>
    <a href="friends.html" data-nav="friends"><span class="icon">&#129309;</span>Friends</a>
    <a href="chatting.html" data-nav="chatting"><span class="icon">&#128172;</span>Chatting</a>
    <a href="profile.html" data-nav="profile"><span class="icon">&#128578;</span>Profile</a>
    <a href="settings.html" data-nav="settings"><span class="icon">&#9881;&#65039;</span>Settings</a>
  </div>
</div>

<script src="api.js"></script>
<script src="main.js"></script>
<script>
  Auth.requireAuth();

  let currentTab = 'friends';
  function showTab(tab) {
    currentTab = tab;
    ['friends', 'sent', 'received'].forEach(function (t) {
      document.getElementById('tab-' + t).classList.toggle('active', t === tab);
    });
    render();
  }

  async function fetchTab(tab) {
    if (tab === 'friends') return Api.listFriends();
    if (tab === 'sent') return Api.listSentRequests();
    return Api.listReceivedRequests();
  }

  async function respond(requestId, accept) {
    try {
      if (accept) await Api.acceptFriendRequest(requestId);
      else await Api.declineFriendRequest(requestId);
      render();
    } catch (err) {
      alert(err.message || 'Could not update that request.');
    }
  }

  async function render() {
    const el = document.getElementById('friendsContent');
    el.innerHTML = '<p class="muted">Loading...</p>';
    let list;
    try {
      list = await fetchTab(currentTab);
    } catch (err) {
      el.innerHTML = '<p class="muted" style="color:var(--danger);">' + (err.message || 'Could not load.') + '</p>';
      return;
    }
    if (!list || list.length === 0) {
      const messages = {
        friends: 'No friends yet.<br>You can add friends in People.',
        sent: 'No pending sent requests.',
        received: 'No pending requests.',
      };
      el.innerHTML = '<div class="empty-state"><div class="emoji">&#128100;</div>' +
        '<p>' + messages[currentTab] + '</p>' +
        '<button class="btn btn-outline btn-sm" onclick="render()">Refresh</button></div>';
      return;
    }
    el.innerHTML = '<div class="list">' + list.map(function (f) {
      const actions = currentTab === 'received'
        ? '<div class="btn-row" style="margin-top:0;flex-shrink:0;width:auto;">' +
          '<button class="btn btn-primary btn-sm" onclick="respond(' + f.requestId + ', true)">Accept</button>' +
          '<button class="btn btn-outline btn-sm" onclick="respond(' + f.requestId + ', false)">Decline</button>' +
          '</div>'
        : '';
      return '<div class="list-row"><div class="avatar">' + f.nickname.charAt(0).toUpperCase() + '</div>' +
        '<div class="info"><div class="name">' + f.nickname + '</div><div class="sub">' + (f.sub || f.status || '') + '</div></div>' +
        actions + '</div>';
    }).join('') + '</div>' +
    '<div class="btn-row" style="margin-top:14px;"><button class="btn btn-outline" onclick="render()">Refresh</button></div>';
  }
  render();
</script>
</body>
</html>
