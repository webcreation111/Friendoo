<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Friendo</title>
<link rel="stylesheet" href="main.css">
</head>
<body data-page="contact">
<div class="app has-desktop-nav">

  <div class="topnav">
    <a href="people.html" class="brand"><img src="logo.png" alt="Friendo"><span>Friendo</span></a>
    <div class="topnav-links">
      <a href="index.html" data-nav="home">Home</a>
      <a href="people.html" data-nav="people">People</a>
      <a href="friends.html" data-nav="friends">Friends</a>
      <a href="chatting.html" data-nav="chatting">Chatting</a>
      <a href="profile.html" data-nav="profile">Profile</a>
      <a href="settings.html" data-nav="settings">Settings</a>
    </div>
    <div class="topnav-right">
      
      <a class="btn btn-primary btn-sm" href="payment.html">Buy</a>
    </div>
  </div>

  <div class="mobile-topbar">
    <a class="back" href="settings.html">&larr; Back</a>
    
    <span style="width:40px"></span>
  </div>

  <div class="page-content">
    <h1 class="page-title">Contact Friendo</h1>

    <div class="tabs">
      <div class="tab active" id="tab-bug" onclick="showForm('bug')">Report Bugs</div>
      <div class="tab" id="tab-support" onclick="showForm('support')">Contact Support</div>
    </div>

    <p id="contactError" class="muted" style="display:none;color:var(--danger);"></p>
    <form id="contactForm" onsubmit="return submitForm(event)">
      <div class="field"><label>Name</label><input type="text" id="nameField" required></div>
      <div class="field"><label>Email</label><input type="email" id="emailField" required></div>
      <div class="field"><label>Message</label><textarea id="msgField" required></textarea></div>
      <button class="btn btn-primary" type="submit" id="contactSubmit">Send</button>
    </form>
    <p class="muted" id="sentNote" style="display:none;">Thanks — your message has been sent to the Friendo team.</p>
  </div>

  <div class="bottomnav">
    <a href="people.html" data-nav="people"><span class="icon">&#128101;</span>People</a>
    <a href="friends.html" data-nav="friends"><span class="icon">&#129309;</span>Friends</a>
    <a href="chatting.html" data-nav="chatting"><span class="icon">&#128172;</span>Chatting</a>
    <a href="profile.html" data-nav="profile"><span class="icon">&#128578;</span>Profile</a>
    <a href="settings.html" data-nav="settings"><span class="icon">&#9881;&#65039;</span>Settings</a>
  </div>
</div>

<script src="api.js"></script>
<script src="main.js"></script>
<script>
  let contactKind = 'bug';
  function showForm(kind) {
    contactKind = kind;
    document.getElementById('tab-bug').classList.toggle('active', kind === 'bug');
    document.getElementById('tab-support').classList.toggle('active', kind === 'support');
    document.getElementById('msgField').placeholder = kind === 'bug' ? 'Describe the bug you found...' : 'How can we help?';
  }

  function showContactError(msg) {
    const el = document.getElementById('contactError');
    el.textContent = msg;
    el.style.display = msg ? 'block' : 'none';
  }

  async function submitForm(e) {
    e.preventDefault();
    showContactError('');
    const btn = document.getElementById('contactSubmit');
    btn.disabled = true;
    try {
      await Api.submitContact({
        type: contactKind,
        name: document.getElementById('nameField').value.trim(),
        email: document.getElementById('emailField').value.trim(),
        message: document.getElementById('msgField').value.trim(),
      });
      document.getElementById('contactForm').reset();
      document.getElementById('sentNote').style.display = 'block';
    } catch (err) {
      showContactError(err.message || 'Could not send your message. Please try again.');
    } finally {
      btn.disabled = false;
    }
    return false;
  }
  showForm('bug');
</script>
</body>
</html>
