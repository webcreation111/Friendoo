<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>People — Friendo</title>
<link rel="stylesheet" href="main.css">
</head>
<body data-page="people">
<div class="app has-desktop-nav">

  <div class="topnav">
    
    <div class="topnav-links">
      <a href="index.html" data-nav="home">Home</a>
      <a href="people.html" data-nav="people">People</a>
      <a href="friends.html" data-nav="friends">Friends</a>
      <a href="chatting.html" data-nav="chatting">Chatting</a>
      <a href="profile.html" data-nav="profile">Profile</a>
      <a href="settings.html" data-nav="settings">Settings</a>
    </div>
    <div class="topnav-right">
      
      <a class="btn btn-primary btn-sm" href="payment.html">Buy</a>
    </div>
  </div>

  <div class="mobile-topbar">
    
    <a href="payment.html" style="font-size:13px;color:var(--primary-dark);font-weight:600;">Buy</a>
  </div>

  <div class="page-content">
    <h1 class="page-title">People</h1>
    <p id="peopleError" class="muted" style="display:none;color:var(--danger);"></p>
    <div class="list" id="peopleList"></div>
  </div>

  <div class="bottomnav">
    <a href="people.html" data-nav="people"><span class="icon">&#128101;</span>People</a>
    <a href="friends.html" data-nav="friends"><span class="icon">&#129309;</span>Friends</a>
    <a href="chatting.html" data-nav="chatting"><span class="icon">&#128172;</span>Chatting</a>
    <a href="profile.html" data-nav="profile"><span class="icon">&#128578;</span>Profile</a>
    <a href="settings.html" data-nav="settings"><span class="icon">&#9881;&#65039;</span>Settings</a>
  </div>
</div>

<!-- Person detail dialog -->
<div class="overlay" id="personDialog">
  <div class="dialog">
    <div class="dialog-header"><h3 id="personName">Name</h3><button class="close" onclick="closeDialog('personDialog')">&times;</button></div>
    <div class="dialog-footer">
      <p class="muted" id="personSub" style="margin-bottom:16px;"></p>
      <button class="btn btn-primary" onclick="addFriendFromDialog()">Add Friend</button>
    </div>
  </div>
</div>

<script src="api.js"></script>
<script src="main.js"></script>
<script>
  Auth.requireAuth();

  const listEl = document.getElementById('peopleList');
  let people = [];

  function showPeopleError(msg) {
    const el = document.getElementById('peopleError');
    el.textContent = msg;
    el.style.display = msg ? 'block' : 'none';
  }

  function renderPeople() {
    if (people.length === 0) {
      listEl.innerHTML = '<div class="empty-state"><div class="emoji">&#128101;</div><p>No one to show right now.</p></div>';
      return;
    }
    listEl.innerHTML = people.map(function (p, i) {
      return '<div class="list-row" onclick="showPerson(' + i + ')">' +
        '<div class="avatar">' + p.nickname.charAt(0).toUpperCase() + '</div>' +
        '<div class="info"><div class="name">' + p.nickname + '</div><div class="sub">' + (p.sub || '') + '</div></div>' +
        '<div class="time">' + (p.lastActive || '') + '</div>' +
        '</div>';
    }).join('');
  }

  async function loadPeople() {
    try {
      const page = await Api.browsePeople();
      people = page.content || page; // Page<T> -> content array
      renderPeople();
    } catch (err) {
      showPeopleError(err.message || 'Could not load people.');
    }
  }

  let selectedPerson = null;
  function showPerson(i) {
    selectedPerson = people[i];
    document.getElementById('personName').textContent = selectedPerson.nickname;
    document.getElementById('personSub').textContent = (selectedPerson.sub || '') + ' \u00b7 Active ' + (selectedPerson.lastActive || 'recently');
    openDialog('personDialog');
  }

  async function addFriendFromDialog() {
    if (!selectedPerson) return;
    try {
      await Api.sendFriendRequest(selectedPerson.userId);
      closeDialog('personDialog');
    } catch (err) {
      alert(err.message || 'Could not send friend request.');
    }
  }

  loadPeople();
</script>
</body>
</html>
